# Netlify build configuration
[build]
  command = "npm run build"
  publish = "dist"

# Functions configuration
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirect /api/* to Netlify serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback: all other requests route to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
